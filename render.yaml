services:
  - type: web
    name: ai-career-connect
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: MISTRAL_API_KEY
        sync: false
