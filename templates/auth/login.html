{% extends "base.html" %}
{% block title %}Login — AI Career Connect{% endblock %}

{% block content %}
<section class="auth-section" id="login-section">
    <h1>Welcome Back</h1>
    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" id="login-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">Log In</button>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </form>
</section>
{% endblock %}
