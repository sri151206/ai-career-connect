{% extends "base.html" %}
{% block title %}Register — AI Career Connect{% endblock %}

{% block content %}
<section class="auth-section" id="register-section">
    <h1>Create Your Account</h1>
    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form" id="register-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="johndoe">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" id="register-btn">Create Account</button>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </form>
</section>
{% endblock %}
